server {
    listen 80;
    server_name _;

    # If your frontend is a static build copied to /usr/share/nginx/html
    root /usr/share/nginx/html;
    index index.html;

    # ---- Compression (JS/CSS/JSON shrink ~70%: much faster first load on mobile data) ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # index.html must never be cached: it names the current hashed JS files. Without this, a phone that cached an
    # old index.html after a new release asks for JS files that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---- Static assets (cache) ----
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # ---- Backend API: /v1 -> backend:8084 ----
    location /v1/ {
        proxy_pass http://syntrack_backend_container:8084/v1/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (safe even if not used)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ---- Optional: Actuator direct proxy (if needed) ----
    location /actuator/ {
        proxy_pass http://syntrack_backend_container:8084/actuator/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- SPA fallback (React Router) ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Upload size (increase if needed) ----
    client_max_body_size 50m;
}
