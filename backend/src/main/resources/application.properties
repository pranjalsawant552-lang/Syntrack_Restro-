# ============================================================
# Application
# ============================================================
spring.application.name=Stock-Management-POS2-System


# ============================================================
# MASTER DATABASE
# Control plane: tenants, super admins, login index, etc.
# ============================================================
# PostgreSQL has no "createDatabaseIfNotExist" URL flag. The app creates this database on
# startup if it is missing (see MasterDataSourceConfig), provided the DB user has CREATEDB.
app.master-db.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:syntrack}
app.master-db.username=${DB_USERNAME:postgres}
app.master-db.password=${DB_PASSWORD:postgres}
app.master-db.driver-class-name=org.postgresql.Driver


# ============================================================
# TENANT DATABASES
# One physical PostgreSQL database per tenant.
#
# Example:
# tenant_acme
# tenant_demo
# tenant_company1
# ============================================================
app.tenant-db.host=${DB_HOST:localhost}
app.tenant-db.port=${DB_PORT:5432}
app.tenant-db.username=${DB_USERNAME:postgres}
app.tenant-db.password=${DB_PASSWORD:postgres}
# Extra JDBC URL params, e.g. ?sslmode=require (leave empty for none)
app.tenant-db.url-params=${DB_URL_PARAMS:}
app.tenant-db.name-prefix=tenant_


# ============================================================
# SERVER
# ============================================================
server.port=8084
server.address=0.0.0.0


# ============================================================
# JPA / HIBERNATE
# ============================================================
# SQL logging is very slow under load; switch on only while debugging (SHOW_SQL=true)
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ============================================================
# DEVTOOLS
# ============================================================
spring.devtools.restart.enabled=true


# ============================================================
# MAIL / SMTP
# Used for forgot-password functionality.
#
# Configure these environment variables when email is required:
#
# MAIL_HOST
# MAIL_PORT
# MAIL_USERNAME
# MAIL_PASSWORD
# MAIL_FROM
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# IMPORTANT (Gmail SMTP): the "From" address MUST be the same mailbox you authenticate
# as (spring.mail.username), or a verified "Send As" alias on that account. Gmail
# silently rejects/overrides mismatched From headers, which is why mail sending can
# appear to succeed in the logs but never actually deliver. Default to the same
# mailbox unless MAIL_FROM is explicitly set to a verified alias.
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@pos-app.local}}


# ============================================================
# FRONTEND
# Used to create password-reset links.
# ============================================================
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# ============================================================
# CORS
# Comma-separated list of origins allowed to call the API.
# In production, set APP_CORS_ALLOWED_ORIGINS to your deployed
# frontend's actual URL(s) -- e.g. https://app.yourcompany.com
# ============================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}


# ============================================================
# JWT
#
# For local development only.
# Set JWT_SECRET as an environment variable for production.
# ============================================================
app.jwt.secret=${JWT_SECRET:wXo7N+5hbs9IUlYkCQ7pPtZ4gbY6JG9L1RAynCb5Tq0=}


# ============================================================
# INITIAL SUPER ADMIN
#
# Automatically seeded on first startup if no super admin exists.
# ============================================================
app.superadmin.email=${SUPERADMIN_EMAIL:superadmin@pos-app.local}
app.superadmin.password=${SUPERADMIN_PASSWORD:ChangeMe@123}


# ============================================================
# LOW-STOCK ALERT
# ============================================================
app.low-stock.threshold=${LOW_STOCK_THRESHOLD:10}

# Every day at 08:00:00
app.low-stock.cron=${LOW_STOCK_CRON:0 0 8 * * *}


# ============================================================
# SWAGGER / OPENAPI
# ============================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


# ============================================================
# ACTUATOR
# Only health and info are exposed.
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized


# ============================================================
# ERROR DETAILS
# DEVELOPMENT ONLY
# ============================================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always


# ============================================================
# LOGGING
# ============================================================

# Spring Web
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.http.converter.json=DEBUG

# JPA / Hibernate
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.springframework.orm.jpa=DEBUG

# ============================================================
# INVENTORY (ingredient stock)
# false = a KOT is never blocked by a stale stock count (stock may go negative and is
#         reported under "negative stock" alerts); true = KOT fails when an ingredient is short.
# ============================================================
app.inventory.block-on-insufficient=${INVENTORY_BLOCK_ON_INSUFFICIENT:false}


# ---- Performance ----
# gzip JSON responses (menus / lists shrink ~80%: big win on mobile data and tablets)
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/csv
server.compression.min-response-size=1024
# Tenant DB pools (per tenant). Keep tenants x max-size below PostgreSQL max_connections.
app.tenant-db.pool.max-size=${TENANT_POOL_MAX:6}
app.tenant-db.pool.min-idle=${TENANT_POOL_MIN_IDLE:1}
# How long a logged-in user's account/permissions are reused between requests (seconds, 0 = look up every request).
app.auth.user-cache-ttl-seconds=${AUTH_CACHE_TTL:10}
# How long the customer-facing QR menu is reused per tenant (seconds; a menu change clears it immediately).
app.qr.menu-cache-ttl-seconds=${QR_MENU_CACHE_TTL:15}
