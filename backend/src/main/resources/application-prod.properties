# ============================================================
# PRODUCTION PROFILE
# Activate with: SPRING_PROFILES_ACTIVE=prod
#
# Required environment variables in production:
#   DB_USERNAME, DB_PASSWORD          - PostgreSQL credentials (user needs CREATEDB)
#   JWT_SECRET                        - long random string (do NOT reuse the dev default)
#   MAIL_USERNAME, MAIL_PASSWORD      - SMTP credentials for outgoing mail
#   MAIL_FROM (optional)              - defaults to MAIL_USERNAME
#   FRONTEND_BASE_URL                 - public URL of the deployed frontend
#   SUPERADMIN_EMAIL, SUPERADMIN_PASSWORD - initial super admin account
#   APP_CORS_ALLOWED_ORIGINS          - comma-separated list of allowed origins
# ============================================================

# ---- Don't leak internals to API clients ----
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ---- Quiet, production-appropriate logging ----
logging.level.root=WARN
logging.level.com.pos.app=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.web.servlet.DispatcherServlet=WARN
logging.level.org.springframework.http.converter.json=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.org.springframework.orm.jpa=WARN

spring.jpa.show-sql=false

# ---- Dev-only features off ----
spring.devtools.restart.enabled=false

# ---- Schema management ----
# The tenant-provisioning flow relies on Hibernate auto-DDL to create each new
# tenant's schema on first use, so this stays "update" rather than "validate"
# even in production. Take regular DB backups and review migrations before
# any structural entity change ships.
spring.jpa.hibernate.ddl-auto=update

# NOTE: the setting above only affects the MASTER persistence unit. The runtime
# TENANT persistence unit intentionally runs with hbm2ddl.auto=none (see
# TenantDataSourceConfig) so it never risks running schema DDL against the wrong
# database through the routing datasource. That means EXISTING tenants' databases
# are NOT auto-migrated when an entity gains a new field/table after this app was
# first deployed for them -- only brand-new tenants get the up-to-date schema.
#
# After deploying a backend build that changed an entity, repair existing tenants'
# schemas (additive-only, no drops/renames, one tenant's own DB at a time) one of
# two ways:
#   1. Manually: PUT /v1/superadmin/tenants/{id}/repair-schema (one tenant), or
#      PUT /v1/superadmin/tenants/repair-schema-all (every tenant at once).
#   2. Automatically on every restart: set app.schema.auto-repair-on-boot=true.
#      Off by default -- opt in only if you want this to happen unattended.
# app.schema.auto-repair-on-boot=false

# ---- Actuator: health/info only, and never expose full health details publicly ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
